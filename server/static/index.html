<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0f1023">
  <title>ClawdPet</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="dashboard">
    <div class="top-bar">
      <div class="connection-info">
        <span id="conn-dot" class="dot dot-disconnected"></span>
        <span id="conn-text" class="conn-label">Disconnected</span>
        <span class="separator">&middot;</span>
        <span id="user-name" class="user-name">Makima</span>
      </div>
      <div class="session-selector" id="session-selector">
        <div class="session-capsule" id="session-capsule">
          <span id="session-dot" class="dot dot-idle"></span>
          <span id="session-name">--</span>
          <span class="capsule-arrow">&#9662;</span>
        </div>
        <div class="session-dropdown" id="session-dropdown"></div>
      </div>
    </div>

    <div class="pet-area" id="pet-area">
      <div class="speech-bubble" id="speech-bubble">
        <span id="bubble-text">Watching...</span>
      </div>
      <canvas id="pet-canvas"></canvas>
    </div>

    <div class="usage-area">
      <div class="usage-section">
        <div class="section-header">
          <span class="section-title">Session</span>
          <span id="session-reset" class="section-time">--</span>
        </div>
        <div class="bar-row">
          <div class="bar-track">
            <div id="session-usage-fill" class="bar-fill session-fill" style="width: 0%"></div>
          </div>
          <span id="session-usage-value" class="bar-value session-color">--</span>
        </div>
      </div>

      <div class="usage-section">
        <div class="section-header">
          <span class="section-title">Weekly</span>
          <span id="weekly-reset" class="section-time">--</span>
        </div>
        <div class="bar-row">
          <span class="bar-label">Opus</span>
          <div class="bar-track">
            <div id="weekly-opus-fill" class="bar-fill opus-fill" style="width: 0%"></div>
          </div>
          <span id="weekly-opus-value" class="bar-value opus-color">--</span>
        </div>
        <div class="bar-row">
          <span class="bar-label">Sonnet</span>
          <div class="bar-track">
            <div id="weekly-sonnet-fill" class="bar-fill sonnet-fill" style="width: 0%"></div>
          </div>
          <span id="weekly-sonnet-value" class="bar-value sonnet-color">--</span>
        </div>
      </div>

      <div id="error-banner" class="error-banner" style="display: none;">
        <span id="error-text"></span>
      </div>
    </div>

    <div class="bottom-bar">
      <div class="clock-area">
        <span id="clock-time" class="clock-time">--:--</span>
        <span id="clock-date" class="clock-date"></span>
      </div>
      <span id="updated-ago" class="updated-ago"></span>
    </div>
  </div>

  <div class="skin-overlay" id="skin-overlay">
    <div class="skin-panel">
      <div class="skin-header">
        <span class="skin-title">Choose pet</span>
        <button id="skin-close" class="skin-close" aria-label="Close">&times;</button>
      </div>
      <div class="skin-grid" id="skin-grid"></div>
    </div>
  </div>

  <input type="file" id="skin-file-input" accept=".png,.gif,.webp,.zip" style="display:none">

  <script src="pet.js"></script>
  <script src="app.js"></script>
</body>
</html>
